name: Validator

on:
  workflow_call:
    outputs:
      ambiente:
        value: ${{ jobs.validator.outputs.ambiente }}

jobs:

  validator:

    runs-on: ubuntu-latest

    outputs:
      ambiente: ${{ steps.detect.outputs.ambiente }}

    steps:

      - uses: actions/checkout@v4

      - id: detect
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ambiente=pullrequest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
            echo "ambiente=prd" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "uat" || "${{ github.ref_name }}" == release/* ]]; then
            echo "ambiente=uat" >> "$GITHUB_OUTPUT"
          else
            echo "ambiente=hml" >> "$GITHUB_OUTPUT"
          fi
