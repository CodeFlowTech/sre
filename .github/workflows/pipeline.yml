name: Pipeline

on:
  workflow_call:

jobs:

  validator:
    runs-on: ubuntu-latest
    steps:      
      - uses: CodeFlowTech/sre/modules/build/dotnet@main

  analysis:
    needs: validator
    runs-on: ubuntu-latest
    steps:
      - uses: CodeFlowTech/sre/modules/build/dotnet@main

  build:
    needs: analysis
    runs-on: ubuntu-latest
    steps:
      - uses: CodeFlowTech/sre/modules/build/dotnet@main

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: CodeFlowTech/sre/modules/build/dotnet@main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: CodeFlowTech/sre/modules/build/dotnet@main

  notification:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: CodeFlowTech/sre/modules/build/dotnet@main