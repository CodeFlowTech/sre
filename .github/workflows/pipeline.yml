name: Pipeline

on:
  workflow_call:

jobs:

  validator:
    uses: CodeFlowTech/sre/modules/validators/validation.yaml@main
  
  flow_hml:
    needs: validator
    if: needs.validator.outputs.ambiente == 'hml'
    uses: CodeFlowTech/sre/.github/workflows/flow-ambiente-hml.yml@main

  flow_prd:
    needs: validator
    if: needs.validator.outputs.ambiente == 'prd'
    uses: CodeFlowTech/sre/.github/workflows/flow-ambiente-prd.yml@main

  flow_uat:
    needs: validator
    if: needs.validator.outputs.ambiente == 'uat'
    uses: CodeFlowTech/sre/.github/workflows/flow-ambiente-uat.yml@main

  flow_pullrequest:
    needs: validator
    if: needs.validator.outputs.ambiente == 'pullrequest'
    uses: CodeFlowTech/sre/.github/workflows/flow-pullrequest.yml@main
