name: Pipeline

on:
  workflow_call:

jobs:

  initialize:
    uses: ./.github/workflows/initialize.yml

  pr:
    needs: initialize
    if: needs.initialize.outputs.flow == 'pr'
    uses: ./.github/workflows/flows/pull-request.yml

  hml:
    needs: initialize
    if: needs.initialize.outputs.flow == 'hml'
    uses: ./.github/workflows/flows/hml.yml

  uat:
    needs: initialize
    if: needs.initialize.outputs.flow == 'uat'
    uses: ./.github/workflows/flows/uat.yml

  prd:
    needs: initialize
    if: needs.initialize.outputs.flow == 'prd'
    uses: ./.github/workflows/flows/prd.yml
