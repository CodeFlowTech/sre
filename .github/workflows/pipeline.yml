name: Pipeline

on:
  workflow_call:

jobs:

  validator:
    name: Validator
    runs-on: ubuntu-latest
    outputs:
      ambiente: ${{ steps.validation.outputs.ambiente }}
    steps:
      - id: validation
        uses: ./.github/actions/validator

  test_analyse:
    name: Test Analyse
    needs: validator
    runs-on: ubuntu-latest
    steps:
      - id: test_analyse
        uses: ./.github/actions/validator

  build:
    name: Build
    needs: test_analyse
    runs-on: ubuntu-latest
    steps:
      - id: build
        uses: ./.github/actions/validator

  approval:
    name: ${{ github.ref == 'refs/heads/main' && 'Approval-GMUD' || (github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/release/')) && 'Approval-QA' || format('Approval-{0}', github.ref_name) }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: approval
        uses: ./.github/actions/validator

  deploy:
    name: ${{ github.ref == 'refs/heads/main' && 'Deploy-PRD' || github.ref == 'refs/heads/staging' && 'Deploy-HML' || startsWith(github.ref, 'refs/heads/release/') && 'Deploy-UAT' || format('Deploy-{0}', github.ref_name) }}
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: ./.github/actions/validator

  comunicate:
    name: Communicate
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - id: comunicate
        uses: ./.github/actions/validator

