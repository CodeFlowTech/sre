name: Build Python
description: Installs dependencies and runs tests when Python project files exist

inputs:
  python-version:
    description: Python version
    default: "3.12"
    required: false

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      if: hashFiles('pyproject.toml', 'requirements.txt') != ''
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Install dependencies
      if: hashFiles('pyproject.toml', 'requirements.txt') != ''
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        if [[ -f requirements.txt ]]; then
          pip install -r requirements.txt
        elif [[ -f pyproject.toml ]]; then
          pip install .
        fi

    - name: Test
      if: hashFiles('pyproject.toml', 'requirements.txt') != ''
      shell: bash
      run: |
        set -euo pipefail
        if command -v pytest >/dev/null 2>&1; then
          pytest
        else
          echo "pytest is not installed; skipping tests."
        fi

    - name: Skip Python build
      if: hashFiles('pyproject.toml', 'requirements.txt') == ''
      shell: bash
      run: |
        set -euo pipefail
        echo "No Python project file found; skipping Python build."
