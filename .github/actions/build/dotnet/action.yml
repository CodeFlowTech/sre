name: Build .NET
description: Restores and builds .NET projects when a solution or project file exists

inputs:
  dotnet-version:
    description: .NET SDK version
    default: "8.0.x"
    required: false

runs:
  using: composite
  steps:
    - name: Setup .NET
      if: hashFiles('**/*.sln', '**/*.csproj') != ''
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore
      if: hashFiles('**/*.sln', '**/*.csproj') != ''
      shell: bash
      run: |
        set -euo pipefail
        dotnet restore

    - name: Build
      if: hashFiles('**/*.sln', '**/*.csproj') != ''
      shell: bash
      run: |
        set -euo pipefail
        dotnet build --configuration Release --no-restore

    - name: Skip .NET build
      if: hashFiles('**/*.sln', '**/*.csproj') == ''
      shell: bash
      run: |
        set -euo pipefail
        echo "No .NET solution or project file found; skipping .NET build."
