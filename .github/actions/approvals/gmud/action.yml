name: GMUD Approval

description: Documents the production approval gate

inputs:
  ambiente:
    description: Target environment
    required: false
    default: prd

runs:
  using: composite

  steps:
    - name: Validate GMUD number
      shell: bash
      env:
        GMUD_NUMBER: ${{ inputs.gmud_number }}
      run: |
        set -euo pipefail

        export
