name: Validator
description: Detects the target pipeline environment

outputs:
  ambiente:
    description: Detected target environment
    value: ${{ steps.detect.outputs.ambiente }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail

        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          echo "ambiente=pullrequest" >> "$GITHUB_OUTPUT"
        elif [[ "$REF_NAME" == "main" || "$REF_NAME" == "master" ]]; then
          echo "ambiente=prd" >> "$GITHUB_OUTPUT"
        elif [[ "$REF_NAME" == "uat" || "$REF_NAME" == release/* ]]; then
          echo "ambiente=uat" >> "$GITHUB_OUTPUT"
        else
          echo "ambiente=hml" >> "$GITHUB_OUTPUT"
        fi
