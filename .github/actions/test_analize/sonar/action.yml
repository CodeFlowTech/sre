name: SonarQube Analysis
description: Runs SonarQube analysis when SONAR_TOKEN is available

runs:
  using: composite
  steps:
    - name: Run SonarQube
      if: env.SONAR_TOKEN != ''
      uses: SonarSource/sonarqube-scan-action@v6

    - name: Skip SonarQube
      if: env.SONAR_TOKEN == ''
      shell: bash
      run: |
        set -euo pipefail
        echo "SONAR_TOKEN was not provided; skipping SonarQube analysis."
