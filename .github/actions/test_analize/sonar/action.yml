name: SonarQube Analysis
description: Runs SonarQube analysis when SONAR_TOKEN is available

inputs:
  fetch-depth:
    description: Git fetch depth used by checkout
    default: "0"
    required: false

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Run SonarQube
      if: env.SONAR_TOKEN != ''
      uses: SonarSource/sonarqube-scan-action@v6

    - name: Skip SonarQube
      if: env.SONAR_TOKEN == ''
      shell: bash
      run: |
        set -euo pipefail
        echo "SONAR_TOKEN was not provided; skipping SonarQube analysis."
