name: Gitleaks
description: Scans the repository for committed secrets

runs:
  using: composite
  steps:
    - name: Skip gitleaks
      if: env.GITLEAKS_TOKEN == ''
      shell: bash
      run: |
        set -euo pipefail
        echo "GITLEAKS_TOKEN was not provided; skipping Gitleaks analysis."

